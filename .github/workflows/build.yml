name: Build WiiSXRX_2022

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: 安装基础工具
        run: |
          apt-get update
          apt-get install -y \
            git ca-certificates \
            wget curl zstd unzip bzip2 xz-utils \
            make gcc g++ file python3

      - name: 检出源码（不拉子模块，依赖已内嵌）
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 安装 devkitPPC r41-2
        run: |
          set -e
          DEVPAGE="https://wii.leseratte10.de/devkitPro/devkitPPC/r41%20%282022-05-31%29/"
          FILE=$(wget -qO- "$DEVPAGE" | grep -oE 'devkitPPC-r41-2[^"<]*linux_x86_64[^"<]*\.pkg\.tar\.xz' | head -1)
          [ -n "$FILE" ] || { echo "!! 文件名解析失败"; exit 1; }
          wget -q "${DEVPAGE}${FILE}"
          mkdir -p /tmp/dkp /opt/devkitpro
          tar -xf "$FILE" -C /tmp/dkp
          cp -r /tmp/dkp/opt/devkitpro/* /opt/devkitpro/ 2>/dev/null || \
          cp -r /tmp/dkp/usr/* /opt/devkitpro/ 2>/dev/null || true

      - name: 安装作者的预编译库（libogc2 + Lightning + Lightrec + 修改版 rules）
        run: |
          set -e
          for URL in \
            "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/lightrec%2BLibogc2.zip" \
            "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/lightrec+Libogc2.zip"; do
            wget -q "$URL" -O libs.zip && break
          done
          rm -rf /tmp/libs && mkdir -p /tmp/libs
          unzip -o libs.zip -d /tmp/libs
          TOP_DIR=$(find /tmp/libs -maxdepth 2 -type d -name "devkitPPC" -printf "%h\n" | head -1)
          [ -n "$TOP_DIR" ] || { echo "!! zip 结构异常"; exit 1; }
          cp -r "$TOP_DIR"/* /opt/devkitpro/
          # 复制 wii_rules 到 devkitPPC（Makefile 硬编码引用）
          cp -v /opt/devkitpro/libogc2/wii_rules /opt/devkitpro/devkitPPC/wii_rules

      - name: 安装作者的 libSDL.a
        run: |
          mkdir -p /opt/devkitpro/portlibs/wii/lib
          wget -q "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/libSDL.a" \
            -O /opt/devkitpro/portlibs/wii/lib/libSDL.a

      - name: 提取并补全 base_tools
        run: |
          set -e
          wget -q "https://wii.leseratte10.de/devkitPro/buildscripts/buildscripts-20200412.tar.bz2" \
            -O /tmp/bs.tar.bz2
          mkdir -p /tmp/bs && tar -xjf /tmp/bs.tar.bz2 -C /tmp/bs
          FIRST=$(find /tmp/bs -name "base_tools" | head -1)
          cp -v "$FIRST" /opt/devkitpro/devkitPPC/base_tools
          echo 'export PREFIX := $(DEVKITPPC)/bin/powerpc-eabi-' >> /opt/devkitpro/devkitPPC/base_tools
          echo 'export SILENTMSG ?= @echo' >> /opt/devkitpro/devkitPPC/base_tools
          echo 'export SILENTCMD ?= @' >> /opt/devkitpro/devkitPPC/base_tools

      - name: 创建 bin2s 等价脚本
        run: |
          set -e
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          mkdir -p /opt/devkitpro/tools/bin
          if ! command -v as >/dev/null 2>&1; then
            ln -sf /opt/devkitpro/devkitPPC/bin/powerpc-eabi-as /opt/devkitpro/devkitPPC/bin/as
          fi
          cat > /opt/devkitpro/tools/bin/bin2s << 'EOF'
          #!/bin/bash
          ALIGN=4
          FILE=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -a) ALIGN="$2"; shift 2;;
              *)  FILE="$1"; shift;;
            esac
          done
          [ -n "$FILE" ] || { echo "usage: bin2s [-a align] file" >&2; exit 1; }
          NAME=$(basename "$FILE" | sed 's/^\([0-9]\)/_\1/' | sed 's/[^A-Za-z0-9_]/_/g')
          echo ".section .rodata"
          echo ".align $ALIGN"
          echo ".global $NAME"
          echo "$NAME:"
          echo ".incbin \"$FILE\""
          echo ".global ${NAME}_end"
          echo "${NAME}_end:"
          echo ".global ${NAME}_size"
          echo ".set ${NAME}_size, ${NAME}_end - ${NAME}"
          EOF
          chmod +x /opt/devkitpro/tools/bin/bin2s

      - name: 构建 WiiSXRX_Release（生成 .dol）
        run: |
          set -e
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          cd "$GITHUB_WORKSPACE"

          # 0. 去掉 -flto（避免 .elf 巨大）
          echo "=== 去掉 -flto ==="
          find Gamecube -name "Makefile*" -exec sed -i 's/-flto//g' {} \; 2>/dev/null || true
          sed -i 's/-flto//g' /opt/devkitpro/devkitPPC/base_rules \
                            /opt/devkitpro/devkitPPC/wii_rules \
                            /opt/devkitpro/libogc2/wii_rules 2>/dev/null || true

          # 0b. 修 psxmem.c 的 impossible constraint（去掉 -flto 后必现）
          echo "=== 修补 psxmem.c CAST_SetGQR ==="
          grep -n "__set_gqr" psxmem.c | head -5
          sed -i 's|__set_gqr(GQR,val);|switch(GQR){case 0:__set_gqr(0,val);break;case 1:__set_gqr(1,val);break;case 2:__set_gqr(2,val);break;case 3:__set_gqr(3,val);break;case 4:__set_gqr(4,val);break;case 5:__set_gqr(5,val);break;case 6:__set_gqr(6,val);break;case 7:__set_gqr(7,val);break;case 8:__set_gqr(8,val);break;case 9:__set_gqr(9,val);break;case 10:__set_gqr(10,val);break;case 11:__set_gqr(11,val);break;case 12:__set_gqr(12,val);break;case 13:__set_gqr(13,val);break;case 14:__set_gqr(14,val);break;case 15:__set_gqr(15,val);break;default:break;}|' psxmem.c 2>/dev/null || true

          # 0c. 清理重编
          rm -rf Gamecube/build_release Gamecube/build_debug

          EXTRA="SILENTMSG=@echo SILENTCMD=@ \
            CC=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc \
            CXX=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-g++ \
            AS=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-as \
            LD=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-g++ \
            AR=/opt/devkitpro/devkitPPC/bin/powerpc-eabi-ar"

          # 1. 补充 zlib 头文件
          mkdir -p /opt/devkitpro/libogc2/include
          cp -v deps/libchdr/deps/zlib-1.3.1/zlib.h \
                deps/libchdr/deps/zlib-1.3.1/zconf.h \
                /opt/devkitpro/libogc2/include/ 2>/dev/null || true

          # 2. 第一次 make（编译依赖库）
          make Wii_Release -j$(nproc) $EXTRA || echo "首次构建失败，继续尝试"

          # 3. 复制缺失库
          mkdir -p /opt/devkitpro/libogc2/lib/wii
          cp -v deps/libchdr/deps/zlib-1.3.1/bin/lib/libzlibstatic.a \
                /opt/devkitpro/libogc2/lib/wii/libz.a 2>/dev/null || true
          cp -v deps/opengx/lib/libOpengx.a \
                /opt/devkitpro/libogc2/lib/wii/libopengx.a 2>/dev/null || true

          # 4. 第二次 make
          make Wii_Release -j$(nproc) $EXTRA || echo "elf2dol 失败，由 Python 兜底"

          # 5. 检查 .elf 大小（关键）
          ELF=$(find . -name "WiiSXRX_Release.elf" | head -1)
          ELFSIZE=$(stat -c %s "$ELF")
          echo "=== .elf 大小: $ELFSIZE 字节 ($((ELFSIZE/1024/1024)) MB) ==="
          if [ "$ELFSIZE" -gt 209715200 ]; then
            echo "!! .elf 仍巨大，打印段信息"
            /opt/devkitpro/devkitPPC/bin/powerpc-eabi-readelf -l "$ELF" 2>/dev/null | head -60
            exit 1
          fi

          # 6. Python ELF→DOL 转换（脚本同前，验证大小）
          python3 - << 'PYEOF'
          import struct, os

          def elf_to_dol(data):
              if data[:4] != b'\x7fELF' or data[4] != 1 or data[5] != 2:
                  raise RuntimeError("not 32-bit BE ELF")
              e_entry = struct.unpack_from('>I', data, 24)[0]
              e_phoff = struct.unpack_from('>I', data, 28)[0]
              e_phentsize = struct.unpack_from('>H', data, 42)[0]
              e_phnum = struct.unpack_from('>H', data, 44)[0]
              segs = []
              for i in range(e_phnum):
                  off = e_phoff + i * e_phentsize
                  t, p_off, p_vaddr, p_paddr, p_fsz, p_msz, p_flags, _ = \
                      struct.unpack_from('>IIIIIIII', data, off)
                  if t == 1:
                      segs.append((p_vaddr, p_off, p_fsz, p_msz, p_flags))
              segs.sort(key=lambda s: s[0])
              text, dta = [], []
              for vaddr, off, fsz, msz, flags in segs:
                  (text if flags & 1 else dta).append((vaddr, off, fsz))
              bss_addr = bss_size = 0
              if segs:
                  lv, lo, lf, lm, lfl = segs[-1]
                  if lm > lf:
                      bss_addr = lv + lf
                      bss_size = lm - lf
              text += [None] * (7 - len(text))
              dta  += [None] * (7 - len(dta))
              hdr = bytearray(0x100)
              pos = 0x100
              tpos, dpos = [], []
              for i in range(7):
                  tpos.append(pos if text[i] else 0)
                  if text[i]: pos = (pos + text[i][2] + 31) & ~31
              for i in range(7):
                  dpos.append(pos if dta[i] else 0)
                  if dta[i]: pos = (pos + dta[i][2] + 31) & ~31
              for i in range(7):
                  struct.pack_into('>I', hdr, 0x00 + i*4, tpos[i])
                  struct.pack_into('>I', hdr, 0x1C + i*4, dpos[i])
                  struct.pack_into('>I', hdr, 0x38 + i*4, text[i][0] if text[i] else 0)
                  struct.pack_into('>I', hdr, 0x54 + i*4, dta[i][0] if dta[i] else 0)
                  struct.pack_into('>I', hdr, 0x70 + i*4, text[i][2] if text[i] else 0)
                  struct.pack_into('>I', hdr, 0x8C + i*4, dta[i][2] if dta[i] else 0)
              struct.pack_into('>I', hdr, 0xA8, bss_addr)
              struct.pack_into('>I', hdr, 0xAC, bss_size)
              struct.pack_into('>I', hdr, 0xB0, e_entry)
              out = bytearray(hdr)
              for i in range(7):
                  if text[i]:
                      v, o, s = text[i]
                      out += data[o:o+s]
                      out += b'\x00' * ((-len(out)) % 32)
              for i in range(7):
                  if dta[i]:
                      v, o, s = dta[i]
                      out += data[o:o+s]
                      out += b'\x00' * ((-len(out)) % 32)
              return bytes(out)

          for root, dirs, files in os.walk('.'):
              for fn in files:
                  if fn == 'WiiSXRX_Release.elf':
                      elf = os.path.join(root, fn)
                      dol = elf[:-4] + '.dol'
                      if os.path.exists(dol) and 1048576 <= os.path.getsize(dol) <= 314572800:
                          print(f"✅ 已存在正常 .dol: {dol}")
                          continue
                      print(f"转换: {elf}")
                      with open(elf, 'rb') as f:
                          data = f.read()
                      out = elf_to_dol(data)
                      if not 1048576 <= len(out) <= 314572800:
                          raise RuntimeError(f"转换结果大小异常: {len(out)}")
                      with open(dol, 'wb') as f:
                          f.write(out)
                      print(f"✅ 生成 {dol} ({len(out)} 字节)")
          PYEOF

      - name: 收集产物
        run: |
          set -e
          mkdir -p dist
          DOL=$(find . -name "WiiSXRX_Release.dol" | head -1)
          [ -n "$DOL" ] || { echo "!! 未找到 .dol"; exit 1; }
          SIZE=$(stat -c %s "$DOL")
          if [ "$SIZE" -lt 1048576 ] || [ "$SIZE" -gt 314572800 ]; then
            echo "!! .dol 大小异常: $SIZE 字节"; exit 1
          fi
          cp -v "$DOL" dist/WiiSXRX_Release.dol
          ls -la dist/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: WiiSXRX-${{ github.sha }}
          path: dist/