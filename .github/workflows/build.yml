name: Build WiiSXRX_2022

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      # ↓↓↓ 关键：先装 git，checkout 才能用本地 git 模式（支持子模块）↓↓↓
      - name: 安装基础工具（含 git，checkout 必需）
        run: |
          apt-get update
          apt-get install -y \
            git ca-certificates \
            wget curl zstd unzip bzip2 xz-utils \
            make gcc g++ file

      - name: 检出源码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 若报 .gitmodules 错误，改成 false

      - name: 探查项目结构（调试用）
        run: |
          echo "=== 根目录 ==="
          ls -la
          echo "=== 查找构建文件 ==="
          find . -maxdepth 3 \( -name "Makefile" -o -name "CMakeLists.txt" -o -name "*.sh" \) | head -30
          echo "=== pcsx_rearmed 目录 ==="
          ls pcsx_rearmed/ 2>/dev/null | head -20 || echo "(无 pcsx_rearmed 目录)"

      - name: 下载并安装 devkitPPC r41-2
        run: |
          set -e
          DEVPAGE="https://wii.leseratte10.de/devkitPro/devkitPPC/r41%20%282022-05-31%29/"
          echo "=== 列出 r41 目录中的 devkitPPC 包 ==="
          wget -qO- "$DEVPAGE" | grep -oE 'devkitPPC-r41-2[^"<]*linux_x86_64[^"<]*\.pkg\.tar\.(xz|zst)' || true
          # 优先匹配 .xz（实际文件名），.zst 作备选
          FILE=$(wget -qO- "$DEVPAGE" | grep -oE 'devkitPPC-r41-2[^"<]*linux_x86_64[^"<]*\.pkg\.tar\.(xz|zst)' | head -1)
          echo "解析到文件: $FILE"
          [ -n "$FILE" ] || { echo "!! 文件名解析失败"; exit 1; }

          wget -q "${DEVPAGE}${FILE}"
          ls -la "$FILE"

          mkdir -p /tmp/dkp /opt/devkitpro
          # GNU tar 能自动识别 xz / zst 压缩格式，无需手动指定
          tar -xf "$FILE" -C /tmp/dkp
          echo "=== pacman 包内部结构 ==="
          find /tmp/dkp -maxdepth 4 -type d | head -30
          # 把内容合并到 /opt/devkitpro
          cp -r /tmp/dkp/opt/devkitpro/* /opt/devkitpro/ 2>/dev/null || \
          cp -r /tmp/dkp/usr/* /opt/devkitpro/ 2>/dev/null || true
          echo "=== /opt/devkitpro ==="
          ls /opt/devkitpro

      - name: 下载并安装作者的预编译库（libogc2 + Lightning + Lightrec）
        run: |
          set -e
          wget -q "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/lightrec%2BLibogc2.zip" -O libs.zip || \
          wget -q "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/lightrec+Libogc2.zip" -O libs.zip
          ls -la libs.zip
          mkdir -p /tmp/libs
          unzip -o libs.zip -d /tmp/libs
          echo "=== zip 内容结构 ==="
          find /tmp/libs -maxdepth 3 | head -50
          cp -r /tmp/libs/* /opt/devkitpro/ 2>/dev/null || true

      - name: 安装作者的 libSDL.a
        run: |
          mkdir -p /opt/devkitpro/portlibs/wii/lib /opt/devkitpro/portlibs/ppc/lib
          wget -q "https://github.com/xjsxjs197/WiiSXRX_2022/raw/main/libSDL.a" -O /opt/devkitpro/portlibs/wii/lib/libSDL.a
          ls -la /opt/devkitpro/portlibs/wii/lib/libSDL.a

      - name: 设置环境变量并验证工具链
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITPPC=/opt/devkitpro/devkitPPC" >> $GITHUB_ENV
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          echo "=== 编译器版本 ==="
          powerpc-eabi-gcc --version | head -1
          echo "=== 关键文件 ==="
          find /opt/devkitpro -name "base_rules" 2>/dev/null | head
          find /opt/devkitpro -name "liblightrec*" 2>/dev/null | head
          find /opt/devkitpro -name "liblightning*" 2>/dev/null | head

      - name: 构建
        run: |
          set -e
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          if [ -f Makefile ] || [ -f makefile ]; then BD=".";
          elif [ -d pcsx_rearmed ] && [ -f pcsx_rearmed/Makefile ]; then BD="pcsx_rearmed";
          else BD="pcsx_rearmed"; fi
          echo "构建目录: $BD"
          cd "$BD"
          make -j$(nproc)

      - name: 收集产物
        run: |
          mkdir -p dist
          find . -maxdepth 6 \( -name "*.dol" -o -name "*.elf" \) -exec ls -la {} \;
          find . -maxdepth 6 \( -name "*.dol" -o -name "*.elf" \) -exec cp -v {} dist/ \;
          ls -la dist/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: WiiSXRX-${{ github.sha }}
          path: dist/